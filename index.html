<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quotes • Daily Inspiration</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="container">
    <h1>✨ Random Quotes</h1>
    <div class="quote-box">
      <p id="quote">"The only way to do great work is to love what you do."</p>
      <p id="author" class="author">- Steve Jobs</p>
    </div>
    
    <div class="buttons">
      <button onclick="getNewQuote()">New Quote</button>
      <button onclick="copyQuote()">📋 Copy</button>
      <button onclick="shareOnTwitter()">𝕏 Share</button>
    </div>
  </div>

  <!-- GitHub Footer -->
  <footer>
    <p>
      Made with ❤️ by 
      <a href="https://github.com/farxanyusuf" target="_blank">
        <i class="fab fa-github"></i> @farxanyusuf
      </a>
    </p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
